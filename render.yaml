services:
  # 1. Backend Web Service
  - type: web
    name: veloop-tap-backend
    env: node
    plan: free
    rootDir: Task 1/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Add your MongoDB Atlas connection string in Render Dashboard

  # 2. Frontend Static Site
  - type: web
    name: veloop-tap-frontend
    env: static
    plan: free
    rootDir: Task 1/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://<your-backend-name>.onrender.com/api
